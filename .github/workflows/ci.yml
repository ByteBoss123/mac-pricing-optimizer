name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.16.9
      - run: ruff check src tests
      - name: Verify source data checksums
        working-directory: data/raw
        run: sha256sum -c leaderboard.csv.sha256 nadac_history.parquet.sha256
      - run: python -m pytest -q
        env: {PYTHONPATH: src}
      - name: Re-run optimizer scenarios
        run: python -m macopt.run
        env: {PYTHONPATH: src}
      - uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: outputs/
